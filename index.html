<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ADVIENTO CERO — El Misterio del Ventisquero</title>

  <meta name="theme-color" content="#B91C1C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Adviento Cero">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="imagenes/icon.svg">
  <link rel="apple-touch-icon" href="imagenes/cover-hotel.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/liquid-christmas.css?v=1.3.0">
  <link rel="stylesheet" href="css/advent-board.css?v=1.3.0">
  <link rel="stylesheet" href="css/puzzles.css?v=1.3.0">
  <link rel="stylesheet" href="css/mobile-ux.css?v=1.3.0">

  <!-- Firebase Realtime Database Compat SDK (para GitHub Pages sin bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="candy-stripe-bar" aria-hidden="true"></div>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <!-- Selector de Identidad Inicial: Miguel vs Patri -->
  <div id="identity-overlay" class="identity-overlay" role="dialog" aria-modal="true" aria-labelledby="id-title">
    <div class="identity-modal">
      <img src="imagenes/cover-hotel.jpg" alt="Hotel El Mirador del Ventisquero" class="identity-cover">
      <div class="identity-kicker">ADVIENTO CERO · EDICIÓN COOPERATIVA</div>
      <h1 class="identity-title" id="id-title">¿Quién abre esta terminal?</h1>
      <p class="identity-desc">
        Cada dispositivo recibe pistas exclusivas sobre el mismo crimen. Elige tu nombre para cargar tus enigmas y sincronizar avances con tu pareja.
      </p>
      <div class="identity-grid">
        <button type="button" class="identity-choice" data-choose-role="miguel">
          <span class="badge badge-frost">ANÁLISIS Y ARCHIVO</span>
          <strong>Miguel</strong>
          <span>Planos, luz UV, sensores y registros digitales.</span>
        </button>
        <button type="button" class="identity-choice" data-choose-role="patri">
          <span class="badge badge-gold">CAMPO Y TESTIGOS</span>
          <strong>Patri</strong>
          <span>Tarjetas, coartadas, partes de servicio y llaves.</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Contenedor Principal -->
  <div class="app-shell">
    <!-- Bolas navideñas y estrella colgantes SVG -->
    <svg class="festive-baubles-wrap" viewBox="0 0 360 32" aria-hidden="true">
      <line x1="44" y1="0" x2="44" y2="11" stroke="#FDE68A" stroke-width="1.3"/>
      <circle class="bauble-pulse" cx="44" cy="19" r="7.5" fill="#DC2626" stroke="#FDE68A" stroke-width="1.5"/>
      <line x1="112" y1="0" x2="112" y2="8" stroke="#FDE68A" stroke-width="1.1"/>
      <circle cx="112" cy="14" r="5.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.2"/>
      <line x1="180" y1="0" x2="180" y2="7" stroke="#FDE68A" stroke-width="1.3"/>
      <polygon class="bauble-pulse" points="180,7 184,14 192,15 186,20 187,28 180,24 173,28 174,20 168,15 176,14" fill="#FBBF24"/>
      <line x1="248" y1="0" x2="248" y2="8" stroke="#FDE68A" stroke-width="1.1"/>
      <circle cx="248" cy="14" r="5.5" fill="#DC2626" stroke="#FEF3C7" stroke-width="1.2"/>
      <line x1="316" y1="0" x2="316" y2="11" stroke="#FDE68A" stroke-width="1.3"/>
      <circle class="bauble-pulse" cx="316" cy="19" r="7.5" fill="#16A34A" stroke="#FDE68A" stroke-width="1.5"/>
    </svg>
    <header class="adv-topbar">
      <div class="adv-brand">
        <div class="adv-brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L15 8H9L12 2Z"/><path d="M12 7L17 15H7L12 7Z"/><path d="M12 13L19 21H5L12 13Z"/>
          </svg>
        </div>
        <div class="adv-brand-text">
          <span class="adv-brand-title">ADVIENTO CERO</span>
          <span class="adv-brand-sub">Mirador del Ventisquero</span>
        </div>
      </div>
      <div class="adv-topbar-actions">
        <button type="button" id="topbar-role-pill" class="badge badge-frost" style="cursor:pointer;">Terminal</button>
        <span id="topbar-sync-pill" class="badge">Local</span>
        <button type="button" id="topbar-mute-btn" class="btn btn-sm btn-ghost" style="min-height:30px;padding:4px 8px;font-size:0.7rem;">Audio</button>
      </div>
    </header>

    <!-- Barra oculta de Modo Test / Admin -->
    <div id="admin-bar" class="glass-card" style="display:none;padding:10px 14px;margin-bottom:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border:var(--vg-border-gold);"></div>

    <main>
      <section id="view-calendar" class="view-panel active"></section>
      <section id="view-day" class="view-panel"></section>
      <section id="view-suspects" class="view-panel"></section>
      <section id="view-expediente" class="view-panel"></section>
    </main>
  </div>

  <!-- Dock de Navegación Inferior Mobile-First -->
  <nav class="mobile-dock" aria-label="Navegación principal">
    <button type="button" class="dock-item active" data-tab="calendar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Calendario</span>
    </button>
    <button type="button" class="dock-item" data-tab="day">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Día Activo</span>
    </button>
    <button type="button" class="dock-item" data-tab="suspects">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Sospechosos</span>
    </button>
    <button type="button" class="dock-item" data-tab="expediente">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Expediente</span>
    </button>
  </nav>

  <!-- Modal Ficha / Dedicatoria -->
  <div id="adv-modal" class="adv-modal-backdrop" role="dialog" aria-modal="true">
    <div id="adv-modal-body" class="adv-modal-sheet"></div>
  </div>

  <script src="config/gift-config.js?v=1.0.0"></script>
  <script src="config/firebase-config.js?v=1.0.0"></script>
  <script src="data/case-lore.js?v=1.0.0"></script>
  <script src="data/suspects.js?v=1.0.0"></script>
  <script src="data/days.js?v=1.0.0"></script>
  <script src="js/audio-fx.js?v=1.0.0"></script>
  <script src="js/date-gate.js?v=1.0.0"></script>
  <script src="js/sync-engine.js?v=1.0.0"></script>
  <script src="js/puzzle-engine.js?v=1.3.0"></script>
  <script src="js/app.js?v=1.3.0"></script>
</body>
</html>
